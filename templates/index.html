<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>智能雲端書庫</title>
    <style>
        #loading-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.8); z-index:9999; justify-content:center; align-items:center; }
        .container { display: flex; padding: 20px; }
        #bookGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; width: 100%; }
        .book-card { border: 1px solid #ccc; padding: 10px; }
    </style>
</head>
<body>
    <div id="loading-overlay">處理中...請稍候</div>

    <header>
        <h1>智能雲端書庫</h1>
        <div id="auth">
            <input type="text" id="u" placeholder="帳號"><input type="password" id="p" placeholder="密碼">
            <button onclick="handleLogin(document.getElementById('u').value, document.getElementById('p').value)">登入</button>
        </div>
    </header>

    <div class="container">
        <aside style="width: 200px;"><h3>分類列表</h3><div id="seriesList"></div></aside>
        <main id="bookGrid"></main>
    </div>

    <script>
        async function handleLogin(username, password) {
            const overlay = document.getElementById('loading-overlay');
            overlay.style.display = 'flex';
            try {
                const res = await fetch('/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username, password})});
                if((await res.json()).status === 'success') window.location.reload();
                else alert("登入失敗");
            } finally { overlay.style.display = 'none'; }
        }

        async function loadBooks() {
            const res = await fetch('/books');
            const books = await res.json();
            document.getElementById('bookGrid').innerHTML = books.map(b => 
                `<div class="book-card"><strong>${b.title}</strong><p>${b.series_name || '預設分類'}</p></div>`
            ).join('');
        }
        window.onload = loadBooks;
    </script>
</body>
</html>
