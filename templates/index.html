<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能雲端書庫</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/epub.js/0.3.88/epub.min.js"></script>
    <style>
        :root { --primary-color: #3b82f6; --text-main: #1f2937; --bg-body: #f3f4f6; --bg-panel: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: var(--bg-body); }
        
        /* 閱讀器樣式：Wenku8 風格 */
        .reader-modal-content {
            background: #fdf6ec !important; /* 護眼暖色背景 */
            color: #333 !important;
            max-width: 100vw !important;
            height: 100vh !important;
            padding: 2rem !important;
            box-sizing: border-box;
        }
        #viewer {
            flex: 1;
            background: transparent !important;
            border: none !important;
            padding: 0 15% !important; /* 內文寬度限制 */
            cursor: pointer;
        }
        .reader-header { display: flex; justify-content: space-between; padding-bottom: 1rem; border-bottom: 1px solid #dcdcdc; }

        /* 原有介面樣式 */
        header { background: var(--bg-panel); padding: 1rem 2rem; display: flex; justify-content: space-between; border-bottom: 1px solid #e5e7eb; }
        .container { display: flex; max-width: 1200px; margin: 20px auto; padding: 20px; gap: 20px; }
        .sidebar { width: 280px; background: var(--bg-panel); padding: 1.5rem; border-radius: 8px; }
        .main-content { flex: 1; background: var(--bg-panel); padding: 2rem; border-radius: 8px; }
        .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1.5rem; }
        .book-card { border: 1px solid #e5e7eb; padding: 1rem; text-align: center; cursor: pointer; border-radius: 8px; transition: 0.2s; }
        .book-card:hover { border-color: var(--primary-color); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-book-open-reader"></i> 智能雲端書庫</div>
    </header>

    <div class="container">
        <div class="sidebar">
            <h3>書籍列表</h3>
            <div id="bookList"></div>
        </div>
        <div class="main-content">
            <div class="book-grid" id="bookGrid"></div>
        </div>
    </div>

    <!-- 閱讀器彈窗 -->
    <div class="modal" id="readerModal">
        <div class="modal-content reader-modal-content">
            <div class="reader-header">
                <h3 id="readerTitle" style="margin:0;">載入中...</h3>
                <button onclick="closeReader()" style="border:none; background:none; cursor:pointer; font-size:1.2rem;">✕</button>
            </div>
            <div id="viewer"></div>
        </div>
    </div>

    <script>
        let currentEpub = null;
        let bookRendition = null;

        // 初始化：載入書籍
        async function loadBooks() {
            const res = await fetch('/books');
            const books = await res.json();
            const grid = document.getElementById('bookGrid');
            grid.innerHTML = books.map(b => `
                <div class="book-card" onclick="openReader('${b.file_url}', '${b.title}')">
                    <div>${b.title.replace('.epub', '')}</div>
                </div>
            `).join('');
        }

        // Wenku8 風格閱讀器
        function openReader(fileUrl, title) {
            document.getElementById('readerTitle').innerText = title.replace('.epub', '');
            document.getElementById('viewer').innerHTML = ''; 
            document.getElementById('readerModal').style.display = 'flex';
            
            setTimeout(() => {
                try {
                    currentEpub = ePub(encodeURI(fileUrl));
                    bookRendition = currentEpub.renderTo("viewer", {
                        width: "100%",
                        height: "100%",
                        spread: "none"
                    });
                    
                    bookRendition.display();

                    // 點擊翻頁：左側上一頁，右側下一頁
                    bookRendition.on('click', (e) => {
                        const mid = window.innerWidth / 2;
                        e.pageX < mid ? bookRendition.prev() : bookRendition.next();
                    });
                } catch(e) {
                    alert("解析失敗");
                }
            }, 300);
        }

        function closeReader() {
            document.getElementById('readerModal').style.display = 'none';
            if (currentEpub) { currentEpub.destroy(); }
        }

        window.onload = loadBooks;
    </script>
</body>
</html>
