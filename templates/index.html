<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>智能雲端書庫</title>
    <style>
        :root { --primary-color: #3b82f6; --bg-body: #f3f4f6; --bg-panel: #ffffff; --text-main: #1f2937; }
        body { font-family: sans-serif; background-color: var(--bg-body); margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        header { background: var(--bg-panel); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; }
        .container { display: flex; flex: 1; max-width: 1400px; margin: 0 auto; width: 100%; padding: 20px; gap: 20px; }
        .sidebar { width: 280px; background: var(--bg-panel); padding: 1.5rem; border-radius: 8px; }
        .main-content { flex: 1; background: var(--bg-panel); padding: 2rem; border-radius: 8px; }
        .btn { padding: 0.6rem 1.2rem; border-radius: 6px; border: none; cursor: pointer; background: var(--primary-color); color: white; font-weight: bold; }
        .btn-secondary { background: #e5e7eb; color: var(--text-main); margin-left: 10px; }
        .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1.5rem; }
        .book-card { border: 1px solid #ddd; padding: 1rem; border-radius: 8px; text-align: center; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <div class="logo">智能雲端書庫</div>
        <div id="userPanel">載入中...</div>
    </header>

    <div class="container">
        <div class="sidebar">
            <h3>書籍匯入</h3>
            <button class="btn" onclick="document.getElementById('fileInput').click()">上傳 EPUB</button>
            <input type="file" id="fileInput" multiple onchange="handleFileSelect(this.files)" style="display:none">
            <h3>分流群組</h3>
            <div>全部書籍</div>
        </div>
        <div class="main-content">
            <h2>所有書籍</h2>
            <div id="bookCount">共 0 本</div>
            <div class="book-grid" id="bookGrid"></div>
        </div>
    </div>

    <script>
        // 初始化狀態與 UI
        window.addEventListener('DOMContentLoaded', async () => {
            await checkUserStatus();
            loadBooks();
        });

        async function checkUserStatus() {
            try {
                const res = await fetch('/user/status');
                const data = await res.json();
                const panel = document.getElementById('userPanel');
                if (data.logged_in) {
                    panel.innerText = "使用者帳號";
                } else {
                    panel.innerHTML = `<button class="btn" onclick="alert('登入')">登入</button>
                                       <button class="btn btn-secondary" onclick="alert('註冊')">註冊</button>`;
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function loadBooks() {
            const res = await fetch('/books');
            const books = await res.json();
            document.getElementById('bookCount').innerText = `共 ${books.length} 本`;
            document.getElementById('bookGrid').innerHTML = books.map(b => 
                `<div class="book-card" onclick="window.open('${b.file_url}', '_blank')">${b.title}</div>`
            ).join('');
        }

        async function handleFileSelect(files) {
            const formData = new FormData();
            for (let f of files) formData.append('file', f);
            await fetch('/upload', { method: 'POST', body: formData });
            loadBooks();
        }
    </script>
</body>
</html>
