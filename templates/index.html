<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能雲端書庫</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 引用自 index_3.html 的樣式與佈局 */
        :root { --primary-color: #3b82f6; --bg-body: #f3f4f6; --bg-panel: #ffffff; --border-color: #e5e7eb; }
        body { font-family: sans-serif; margin: 0; background-color: var(--bg-body); display: flex; flex-direction: column; min-height: 100vh; }
        .container { display: flex; flex: 1; max-width: 1400px; margin: 0 auto; padding: 20px; gap: 20px; }
        .sidebar { width: 280px; background: var(--bg-panel); padding: 1.5rem; border-radius: 8px; height: fit-content; }
        .main-content { flex: 1; background: var(--bg-panel); padding: 2rem; border-radius: 8px; }
        .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1.5rem; }
        .book-card { background: #fff; border: 1px solid var(--border-color); padding: 1rem; border-radius: 8px; text-align: center; position: relative; }
        .btn { padding: 0.5rem 1rem; border-radius: 6px; border: none; cursor: pointer; }
        .btn-primary { background: var(--primary-color); color: white; }
    </style>
</head>
<body>
    <header style="padding: 1rem 2rem; border-bottom: 1px solid #ddd; background: white;">
        <div class="logo">智能雲端書庫</div>
    </header>

    <div class="container">
        <div class="sidebar">
            <h3>書籍匯入</h3>
            <input type="file" id="fileInput" multiple onchange="handleFileSelect(this.files)" style="display:none">
            <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">上傳書籍</button>
        </div>
        <div class="main-content">
            <div class="content-header" style="display:flex; justify-content: space-between;">
                <h2>所有書籍</h2>
                <div>
                    <button class="btn" id="selectModeBtn" onclick="toggleSelectionMode()">選取刪除</button>
                    <button class="btn" id="deleteBtn" style="display:none; background:#ef4444; color:white;" onclick="deleteSelected()">刪除所選</button>
                </div>
            </div>
            <div class="book-grid" id="bookGrid"></div>
        </div>
    </div>

    <script>
        let isSelectionMode = false;
        let currentBooks = [];

        // 初始化載入
        window.addEventListener('DOMContentLoaded', () => { loadBooks(); });

        async function loadBooks() {
            try {
                const res = await fetch('/books');
                currentBooks = await res.json();
                renderBookGrid();
            } catch(e) { console.error(e); }
        }

        // 切換模式
        function toggleSelectionMode() {
            isSelectionMode = !isSelectionMode;
            document.getElementById('selectModeBtn').innerText = isSelectionMode ? '取消選取' : '選取刪除';
            document.getElementById('deleteBtn').style.display = isSelectionMode ? 'inline-block' : 'none';
            renderBookGrid();
        }

        // 渲染網格[cite: 1]
        function renderBookGrid() {
            const grid = document.getElementById('bookGrid');
            grid.innerHTML = currentBooks.map(b => `
                <div class="book-card">
                    ${isSelectionMode ? `<input type="checkbox" class="book-checkbox" value="${b.id}">` : ''}
                    <div class="book-title">${b.title}</div>
                </div>
            `).join('');
        }

        // 刪除邏輯[cite: 1]
        async function deleteSelected() {
            const ids = Array.from(document.querySelectorAll('.book-checkbox:checked')).map(cb => cb.value);
            if(ids.length === 0) return alert("請先勾選");
            
            const res = await fetch('/books/delete', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ ids: ids })
            });
            
            if(res.ok) {
                alert("刪除成功");
                isSelectionMode = false;
                document.getElementById('deleteBtn').style.display = 'none';
                await loadBooks(); // 刪除後立即重新載入資料
            }
        }

        async function handleFileSelect(files) {
            const formData = new FormData();
            for (let f of files) formData.append('file', f);
            await fetch('/upload', { method: 'POST', body: formData });
            loadBooks();
        }
    </script>
</body>
</html>
