<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>智能雲端書庫</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/epub.js/0.3.88/epub.min.js"></script>
    <style>
        /* 1. 你指定的 Loading 遮罩樣式 */
        #loading-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.8); z-index:9999; justify-content:center; align-items:center; }
        
        /* 2. 原本的網頁排版樣式 */
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; }
        header { padding: 1rem; background: #eee; }
        .main-container { display: flex; padding: 20px; }
        #sidebar { width: 250px; }
        #bookGrid { display: flex; flex-wrap: wrap; gap: 15px; }
        .book-card { border: 1px solid #ccc; padding: 10px; width: 150px; }
    </style>
</head>
<body>
    <div id="loading-overlay">處理中...請稍候</div>

    <header>
        <h1>智能雲端書庫</h1>
        <div id="auth-section">
            <!-- 登入表單 -->
            <input type="text" id="username" placeholder="帳號">
            <input type="password" id="password" placeholder="密碼">
            <button onclick="handleLogin(document.getElementById('username').value, document.getElementById('password').value)">登入</button>
        </div>
    </header>

    <div class="main-container">
        <div id="sidebar">
            <h3>分類列表</h3>
            <div id="seriesList"></div>
        </div>
        <div id="bookGrid">
            <!-- 書籍內容會透過 JS 載入 -->
        </div>
    </div>
    
    <script>
        // 你指定的優化版登入函式
        async function handleLogin(username, password) {
            const overlay = document.getElementById('loading-overlay');
            overlay.style.display = 'flex';
            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                const data = await res.json();
                if(data.status === 'success') {
                    window.location.reload();
                } else {
                    alert(data.message);
                }
            } catch(e) {
                console.error(e);
            } finally {
                overlay.style.display = 'none';
            }
        }

        // 載入書籍清單的邏輯
        async function loadBooks() {
            try {
                const response = await fetch('/books');
                const books = await response.json();
                const grid = document.getElementById('bookGrid');
                grid.innerHTML = books.map(b => `
                    <div class="book-card">
                        <strong>${b.title}</strong>
                        <p>${b.series_name || '未分類'}</p>
                    </div>
                `).join('');
            } catch (e) {
                console.error("載入失敗:", e);
            }
        }

        // 頁面載入時自動執行
        window.onload = loadBooks;
    </script>
</body>
</html>
