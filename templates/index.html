<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>智能雲端書庫</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/epub.js/0.3.88/epub.min.js"></script>
    <style>
        /* 載入遮罩樣式 */
        #loading-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.8); z-index:9999; justify-content:center; align-items:center; }
    </style>
</head>
<body>
    <div id="loading-overlay">處理中...請稍候</div>

    <!-- 你的內容區域 -->
    
    <script>
        // 優化後的登入函式
        async function handleLogin(username, password) {
            const overlay = document.getElementById('loading-overlay');
            overlay.style.display = 'flex'; // 顯示 Loading
            
            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                const data = await res.json();
                if(data.status === 'success') {
                    window.location.reload();
                } else {
                    alert(data.message);
                }
            } catch(e) {
                console.error(e);
            } finally {
                overlay.style.display = 'none'; // ⚠️ 關鍵：無論成功失敗都要關閉
            }
        }
    </script>
</body>
</html>
