<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能雲端書庫</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/epub.js/0.3.88/epub.min.js"></script>
    <style>
        :root { --primary-color: #3b82f6; --text-main: #1f2937; --bg-body: #f3f4f6; --bg-panel: #ffffff; --border-color: #e5e7eb; }
        body { font-family: sans-serif; margin: 0; background-color: var(--bg-body); }
        .container { display: flex; max-width: 1400px; margin: auto; padding: 20px; gap: 20px; }
        .main-content { flex: 1; background: var(--bg-panel); padding: 2rem; border-radius: 8px; }
        .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.5rem; }
        .book-card { border: 1px solid var(--border-color); padding: 1rem; border-radius: 8px; cursor: pointer; position: relative; background: #fff; }
        .action-btns { position: absolute; top: 5px; right: 5px; display: flex; gap: 5px; z-index: 10; }
        .btn { padding: 5px 10px; cursor: pointer; border: 1px solid var(--border-color); background: #fff; border-radius: 4px; }
        
        /* Wenku8 風格閱讀器 */
        #readerModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; flex-direction: column; }
        .reader-header { background: #fdf6ec; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        #viewer { flex: 1; background: #fdf6ec; padding: 2rem 15%; overflow-y: auto; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="main-content">
        <h2>我的書庫</h2>
        <div class="book-grid" id="bookGrid"></div>
    </div>
</div>

<div id="readerModal">
    <div class="reader-header">
        <h3 id="readerTitle">閱讀中...</h3>
        <button onclick="closeReader()">關閉</button>
    </div>
    <div id="viewer"></div>
</div>

<script>
    let currentRendition = null;

    async function loadBooks() {
        const res = await fetch('/books'); // 後端需確保此路由過濾 user_id
        const books = await res.json();
        const grid = document.getElementById('bookGrid');
        grid.innerHTML = books.map(b => `
            <div class="book-card" onclick="openReader('${b.file_url}', '${b.title}')">
                <div class="action-btns" onclick="event.stopPropagation()">
                    <button class="btn" onclick="renameBook('${b.id}', '${b.title}')"><i class="fa fa-pen"></i></button>
                    <button class="btn" onclick="deleteBook('${b.id}')"><i class="fa fa-trash"></i></button>
                </div>
                <div>${b.title}</div>
            </div>
        `).join('');
    }

    async function deleteBook(id) {
        if(!confirm('確定刪除？')) return;
        await fetch(`/books/${id}`, { method: 'DELETE' });
        loadBooks();
    }

    async function renameBook(id, oldTitle) {
        const newName = prompt('請輸入新名稱:', oldTitle);
        if(!newName) return;
        await fetch(`/books/${id}`, { 
            method: 'PUT', 
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ title: newName }) 
        });
        loadBooks();
    }

    function openReader(url, title) {
        document.getElementById('readerTitle').innerText = title;
        document.getElementById('readerModal').style.display = 'flex';
        document.getElementById('viewer').innerHTML = '';
        const book = ePub(url);
        currentRendition = book.renderTo("viewer", { width: "100%", height: "100%", flow: "paginated" });
        currentRendition.display();
        document.getElementById('viewer').onclick = (e) => {
            e.pageX < window.innerWidth/2 ? currentRendition.prev() : currentRendition.next();
        };
    }

    function closeReader() {
        document.getElementById('readerModal').style.display = 'none';
        if(currentRendition) currentRendition.destroy();
    }

    window.onload = loadBooks;
</script>
</body>
</html>
