<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>智能雲端書庫</title>
    <style>
        /* 恢復原佈局結構[cite: 1] */
        body { font-family: sans-serif; margin: 0; background: #f3f4f6; display: flex; flex-direction: column; height: 100vh; }
        header { display: flex; justify-content: space-between; padding: 1rem 2rem; background: white; border-bottom: 1px solid #ddd; }
        .container { display: flex; flex: 1; padding: 20px; gap: 20px; }
        .sidebar { width: 280px; background: white; padding: 1.5rem; border-radius: 8px; }
        .main-content { flex: 1; background: white; padding: 2rem; border-radius: 8px; }
        .upload-zone { border: 2px dashed #ccc; padding: 20px; text-align: center; cursor: pointer; margin-bottom: 10px; }
        .book-grid { display: grid; grid-template-columns: repeat(auto-fill, 160px); gap: 15px; }
        .book-card { border: 1px solid #ddd; padding: 10px; text-align: center; cursor: pointer; position: relative; }
        .btn { padding: 8px 12px; margin-bottom: 5px; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <div>智能雲端書庫</div>
        <div id="userPanel">載入中...</div>
    </header>
    <div class="container">
        <div class="sidebar">
            <h3>書籍匯入</h3>
            <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
                將 EPUB 拖曳至此<br>或點擊上傳
            </div>
            <input type="file" id="fileInput" multiple onchange="handleFileSelect(this.files)" style="display:none">
            <button class="btn" onclick="document.getElementById('fileInput').click()">選擇多個檔案</button>
            <button class="btn" onclick="document.getElementById('folderInput').click()">選擇整個資料夾</button>
            <input type="file" id="folderInput" webkitdirectory directory multiple onchange="handleFileSelect(this.files)" style="display:none">
            <h3>分流群組</h3>
            <div>全部書籍</div>
        </div>
        <div class="main-content">
            <h2>全部書籍</h2>
            <p>所有書籍</p>
            <div id="bookCount">共 0 本</div>
            <div class="book-grid" id="bookGrid"></div>
        </div>
    </div>

    <script>
        let currentBooks = [];
        
        async function loadBooks() {
            try {
                const res = await fetch('/books');
                currentBooks = await res.json();
                document.getElementById('bookCount').innerText = `共 ${currentBooks.length} 本`;
                render();
            } catch(e) { console.error(e); }
        }

        function render() {
            document.getElementById('bookGrid').innerHTML = currentBooks.map(b => 
                `<div class="book-card" onclick="window.open('${b.file_url}', '_blank')">${b.title}</div>`
            ).join('');
        }

        async function handleFileSelect(files) {
            const formData = new FormData();
            for (let f of files) formData.append('file', f);
            await fetch('/upload', { method: 'POST', body: formData });
            loadBooks();
        }

        // 修復載入迴圈[cite: 1]
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/user/status');
                const data = await res.json();
                document.getElementById('userPanel').innerText = data.logged_in ? "已登入" : "未登入";
            } catch { document.getElementById('userPanel').innerText = "未登入"; }
            loadBooks();
        });
    </script>
</body>
</html>
