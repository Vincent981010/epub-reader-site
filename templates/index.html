<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能雲端書庫</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/epub.js/0.3.88/epub.min.js"></script>
    <style>
        :root { --primary-color: #3b82f6; --primary-hover: #2563eb; --text-main: #1f2937; --text-muted: #6b7280; --bg-body: #f3f4f6; --bg-panel: #ffffff; --border-color: #e5e7eb; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: var(--bg-body); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; }
        header { background-color: var(--bg-panel); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
        .logo { font-size: 1.5rem; font-weight: 600; color: var(--primary-color); }
        .container { display: flex; flex: 1; max-width: 1400px; margin: 0 auto; width: 100%; padding: 20px; gap: 20px; box-sizing: border-box; }
        .sidebar { width: 280px; background: var(--bg-panel); padding: 1.5rem; border-radius: 8px; height: fit-content; }
        .main-content { flex: 1; background: var(--bg-panel); padding: 2rem; border-radius: 8px; }
        .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.5rem; }
        .book-card { background: #fff; border: 1px solid var(--border-color); border-radius: 8px; padding: 1.2rem 1rem; text-align: center; cursor: pointer; transition: 0.2s; position: relative; }
        .book-card:hover { border-color: var(--primary-color); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        /* Wenku8 沉浸式閱讀器樣式 */
        .reader-modal-content {
            background: #fdf6ec !important; /* 護眼暖色 */
            color: #333 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
            border-radius: 0 !important;
            padding: 0 !important;
            display: flex;
            flex-direction: column;
        }
        #viewer {
            flex: 1;
            padding: 2rem 15% !important; /* 模擬閱讀寬度 */
            cursor: pointer;
            overflow-y: auto;
        }
        .wenku-header { display: flex; justify-content: space-between; padding: 1rem 2rem; border-bottom: 1px solid #dcdcdc; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-book-open-reader"></i> 智能雲端書庫</div>
        <div id="userPanel"></div>
    </header>

    <div class="container">
        <div class="sidebar">
            <h3>書籍匯入</h3>
            <button class="btn" onclick="document.getElementById('fileInput').click()">上傳 EPUB</button>
            <input type="file" id="fileInput" style="display:none" onchange="handleFileSelect(this.files)">
        </div>
        <div class="main-content">
            <h2 id="currentCategoryTitle">所有書籍</h2>
            <div class="book-grid" id="bookGrid"></div>
        </div>
    </div>

    <!-- 閱讀器彈窗 -->
    <div class="modal" id="readerModal">
        <div class="modal-content reader-modal-content">
            <div class="wenku-header">
                <h3 id="readerTitle" style="margin:0;">載入中...</h3>
                <button onclick="closeReader()" style="background:none; border:none; cursor:pointer; font-size:1.5rem;">✕</button>
            </div>
            <div id="viewer"></div>
        </div>
    </div>

    <script>
        let currentEpub = null;
        let bookRendition = null;

        // 閱讀器初始化 (Wenku8 模式)
        function openReader(fileUrl, title) {
            document.getElementById('readerTitle').innerText = title.replace('.epub', '');
            document.getElementById('viewer').innerHTML = ''; 
            document.getElementById('readerModal').style.display = 'flex';
            
            setTimeout(() => {
                try {
                    currentEpub = ePub(encodeURI(fileUrl));
                    bookRendition = currentEpub.renderTo("viewer", {
                        width: "100%",
                        height: "100%",
                        spread: "none",
                        flow: "paginated"
                    });
                    bookRendition.display();

                    // 綁定點擊事件：左側上一頁，右側下一頁
                    bookRendition.on('click', (e) => {
                        const mid = window.innerWidth / 2;
                        e.pageX < mid ? bookRendition.prev() : bookRendition.next();
                    });
                } catch(e) { alert("讀取失敗"); }
            }, 300);
        }

        function closeReader() {
            document.getElementById('readerModal').style.display = 'none';
            if (currentEpub) currentEpub.destroy();
        }

        async function loadBooks() {
            const res = await fetch('/books');
            const books = await res.json();
            const grid = document.getElementById('bookGrid');
            grid.innerHTML = books.map(b => `
                <div class="book-card" onclick="openReader('${b.file_url}', '${b.title}')">
                    <div>${b.title.replace('.epub', '')}</div>
                </div>
            `).join('');
        }

        window.onload = loadBooks;
    </script>
</body>
</html>
