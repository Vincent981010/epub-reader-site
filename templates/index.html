<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能雲端書庫</title>
    <!-- 引入 ePub.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/epub.js/0.3.88/epub.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .book-item { background: white; padding: 15px; margin: 10px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        #reader-container { position: fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:1000; display:none; }
    </style>
</head>
<body>

    <h1>智能雲端書庫</h1>
    <div id="auth-status"></div>
    
    <input type="file" id="uploadFile">
    <button onclick="uploadBook()">上傳書籍</button>

    <div id="book-list"></div>

    <!-- 閱讀器視窗 -->
    <div id="reader-container">
        <div style="padding:10px; border-bottom:1px solid #ccc;">
            <button onclick="closeReader()">關閉</button>
            <button id="mode-toggle" onclick="toggleLoadMode()">切換模式: 線上串流</button>
            <button onclick="prevPage()">上一頁</button>
            <button onclick="nextPage()">下一頁</button>
        </div>
        <div id="viewer"></div>
    </div>

    <script>
        let currentBook = null, rendition = null, isFullLoadMode = false;

        // 1. 載入書單
        async function loadBooks() {
            const res = await fetch('/books');
            const books = await res.json();
            const list = document.getElementById('book-list');
            list.innerHTML = `<h3>共 ${books.length} 本</h3>`;
            books.forEach(b => {
                list.innerHTML += `
                    <div class="book-item">
                        <span>${b.title}</span>
                        <button onclick="openBook('${b.file_url}')">閱讀</button>
                    </div>`;
            });
        }

        // 2. 閱讀器控制
        function toggleLoadMode() {
            isFullLoadMode = !isFullLoadMode;
            document.getElementById('mode-toggle').innerText = isFullLoadMode ? "模式: 一次載入" : "模式: 線上串流";
        }

        async function openBook(fileUrl) {
            document.getElementById('reader-container').style.display = 'block';
            if (isFullLoadMode) {
                const res = await fetch(fileUrl);
                currentBook = ePub(await res.arrayBuffer());
            } else {
                currentBook = ePub(fileUrl);
            }
            rendition = currentBook.renderTo("viewer", { width: "100%", height: "90%" });
            rendition.display();
        }

        function closeReader() {
            document.getElementById('reader-container').style.display = 'none';
            document.getElementById('viewer').innerHTML = '';
        }

        function prevPage() { if(rendition) rendition.prev(); }
        function nextPage() { if(rendition) rendition.next(); }

        // 3. 上傳功能
        async function uploadBook() {
            const fileInput = document.getElementById('uploadFile');
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            await fetch('/upload', { method: 'POST', body: formData });
            loadBooks();
        }

        loadBooks();
    </script>
</body>
</html>
