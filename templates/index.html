<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雲端 EPUB 智能書庫</title>
    <style>
        :root {
            --primary: #4a6fa5;
            --primary-hover: #3b5984;
            --success: #2ec4b6;
            --success-hover: #23a99d;
            --danger: #e71d36;
            --danger-hover: #bcf13c;
            --dark: #011627;
            --light: #f6f8fa;
            --gray: #6c757d;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--light);
            color: var(--dark);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        
        header h2 {
            margin: 0;
            font-size: 1.5rem;
        }
        
        .auth-panel {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .auth-panel input {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.9rem;
            width: 110px;
            transition: border-color 0.2s;
        }
        
        .auth-panel input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: background-color 0.2s, opacity 0.2s;
        }
        
        button:hover {
            opacity: 0.95;
        }
        
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: var(--success-hover); }
        
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: var(--danger-hover); }
        
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        
        .card h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1.25rem;
            border-left: 4px solid var(--primary);
            padding-left: 10px;
        }
        
        .book-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #eee;
            transition: background-color 0.2s;
        }
        
        .book-item:last-child {
            border-bottom: none;
        }
        
        .book-item:hover {
            background-color: #fafbfc;
        }
        
        .tag {
            font-size: 0.8em;
            padding: 3px 8px;
            border-radius: 4px;
            margin-left: 8px;
            font-weight: bold;
            display: inline-block;
        }
        
        .tag-temp { background: #ffe3e3; color: var(--danger); }
        .tag-admin { background: #e3faf2; color: var(--success); }
        
        .admin-section {
            border: 2px dashed var(--primary);
            display: none; /* 預設隱藏，管理員登入才透過 JS 秀出 */
        }
        
        .file-upload-wrapper {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            align-items: center;
        }
        
        input[type="file"] {
            padding: 8px;
            border: 1px dashed #ccc;
            border-radius: 6px;
            background: #fafafa;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 頂部導覽與會員狀態列 -->
    <header>
        <h2>📚 雲端 EPUB 智能書庫</h2>
        <div id="authArea" class="auth-panel">
            <span>載入中...</span>
        </div>
    </header>

    <!-- 📥 上傳區塊 -->
    <div class="card">
        <h3>📥 上傳新書籍 (EPUB)</h3>
        <p style="color: var(--gray); font-size: 0.9em; margin: 5px 0 0 0;">
            💡 提示：未登入狀態下上傳的書籍為「臨時書櫃」，系統將於 24 小時後自動銷毀刪除。
        </p>
        <div class="file-upload-wrapper">
            <input type="file" id="epubFile" accept=".epub" style="flex: 1;">
            <button class="btn-primary" onclick="handleUpload()">開始上傳與解析</button>
        </div>
        <div id="uploadStatus" style="margin-top: 12px; font-weight: bold; font-size: 0.95rem;"></div>
    </div>

    <!-- 📖 個人與公開書庫清單 -->
    <div class="card">
        <h3>📖 我的雲端書櫃</h3>
        <div id="bookList">
            <p style="color: #999; text-align: center; padding: 20px 0;">書櫃空空如也，快去上傳一本吧！</p>
        </div>
    </div>

    <!-- 🔧 管理員專屬設定面板 -->
    <div id="adminPanel" class="card admin-section">
        <h3>🔧 系統管理員進階設定</h3>
        <p style="color: #444; font-size: 0.95em;">您已以管理員 (Admin) 身份登入。可在下方新增全局書籍分類櫃：</p>
        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <input type="text" id="newSeriesName" placeholder="輸入新分類名稱 (如：輕小說、技術叢書)" style="flex: 1; padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px;">
            <button class="btn-success" onclick="createNewSeries()">建立新系列分類</button>
        </div>
        <div id="seriesStatus" style="margin-top: 10px; font-weight: bold; color: var(--success); font-size: 0.95rem;"></div>
    </div>
</div>

<script>
    // 網頁載入完成後立即檢查登入狀態
    document.addEventListener("DOMContentLoaded", checkUserStatus);

    function checkUserStatus() {
        fetch('/user/status')
            .then(res => res.json())
            .then(data => {
                const authArea = document.getElementById('authArea');
                const adminPanel = document.getElementById('adminPanel');
                
                if (data.logged_in) {
                    authArea.innerHTML = `
                        <span>歡迎，<b>${data.username}</b> ${data.is_admin ? '<span class="tag tag-admin">管理員</span>' : ''}</span>
                        <button class="btn-danger" onclick="handleLogout()" style="margin-left:10px;">登出</button>
                    `;
                    // 如果是管理員，開啟後台面板
                    if (data.is_admin) {
                        adminPanel.style.display = 'block';
                    } else {
                        adminPanel.style.display = 'none';
                    }
                } else {
                    adminPanel.style.display = 'none';
                    authArea.innerHTML = `
                        <input type="text" id="username" placeholder="帳號">
                        <input type="password" id="password" placeholder="密碼">
                        <button class="btn-primary" onclick="handleLogin()">登入</button>
                        <button class="btn-success" onclick="handleRegister()">註冊</button>
                    `;
                }
                // 狀態更新後，同步載入書籍清單
                loadBookList();
            }).catch(err => {
                console.error("無法連接到後端伺服器", err);
            });
    }

    // 🔐 會員系統機制
    function handleLogin() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value.trim();
        if (!u || !p) { alert("請輸入帳號與密碼！"); return; }

        fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p })
        }).then(res => {
            if (res.ok) { 
                checkUserStatus(); 
            } else { 
                alert("登入失敗，請檢查您的帳號密碼是否正確！"); 
            }
        });
    }

    function handleRegister() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value.trim();
        if (!u || !p) { alert("請輸入想要註冊的帳號與密碼！"); return; }

        fetch('/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p })
        }).then(res => res.json()).then(data => {
            if (data.success) { 
                alert("註冊成功！現在可以直接點擊「登入」按鈕。"); 
            } else { 
                alert(data.error || "註冊失敗，該帳號可能已被使用。"); 
            }
        });
    }

    function handleLogout() {
        fetch('/logout', { method: 'POST' }).then(() => checkUserStatus());
    }

    // 📥 上傳檔案機制
    function handleUpload() {
        const fileInput = document.getElementById('epubFile');
        const statusDiv = document.getElementById('uploadStatus');
        if (!fileInput.files[0]) { alert("請先選擇一個本地的 EPUB 檔案！"); return; }

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        statusDiv.style.color = "orange";
        statusDiv.innerText = "⚡ 正在上傳並解析書籍（大型書籍需要較多時間，請勿重新整理網頁）...";

        fetch('/upload', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    statusDiv.style.color = "var(--danger)";
                    statusDiv.innerText = `❌ 失敗原因: ${data.error}`;
                } else {
                    statusDiv.style.color = "var(--success)";
                    statusDiv.innerText = `🎉 ${data.message}`;
                    fileInput.value = ""; // 清空上傳欄位
                    loadBookList(); // 重新整理書櫃
                }
            }).catch(() => {
                statusDiv.style.color = "var(--danger)";
                statusDiv.innerText = "❌ 連線失敗，請檢查後端日誌。";
            });
    }

    // 📖 渲染書籍清單與下載功能
    function loadBookList() {
        const listDiv = document.getElementById('bookList');
        fetch('/books')
            .then(res => res.json())
            .then(books => {
                if (!books || books.length === 0) {
                    listDiv.innerHTML = '<p style="color: #999; text-align: center; padding: 20px 0;">書櫃空空如也，快去上傳一本吧！</p>';
                    return;
                }
                
                listDiv.innerHTML = books.map(book => `
                    <div class="book-item">
                        <div>
                            <strong style="font-size: 1.1em; color: var(--dark);">${book.title}</strong>
                            <span style="color: #666; margin-left: 10px; font-size: 0.9em;">分類：${book.series_name}</span>
                            ${book.is_temporary ? '<span class="tag tag-temp">⏳ 24h 臨時</span>' : ''}
                            <br>
                            <small style="color: #999; font-size: 0.8em;">上傳者: ${book.uploader || '匿名訪客'}</small>
                        </div>
                        <div>
                            <!-- 📥 直接調用後端精準格式轉換導出接口 -->
                            <button class="btn-success" onclick="window.location.href='/books/${book.id}/download/txt'">
                                📥 一鍵導出 TXT
                            </button>
                        </div>
                    </div>
                `).join('');
            });
    }

    // 👑 管理員功能：建立系列分類櫃
    function createNewSeries() {
        const nameInput = document.getElementById('newSeriesName');
        const statusDiv = document.getElementById('seriesStatus');
        const name = nameInput.value.trim();
        if (!name) { alert("請輸入系列分類名稱！"); return; }

        fetch('/series', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name })
        }).then(res => res.json()).then(data => {
            if (data.error) {
                alert(data.error);
            } else {
                statusDiv.innerText = `✅ 成功建立全局分類櫃：「${data.name}」！`;
                nameInput.value = "";
                setTimeout(() => { statusDiv.innerText = ""; }, 3000);
                loadBookList(); // 重新整理清單
            }
        });
    }
</script>

</body>
</html>
