<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>智能雲端書庫</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background: #f3f4f6; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
        .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .book-card { border: 1px solid #ddd; padding: 15px; margin: 10px; display: inline-block; width: 150px; position: relative; }
        .checkbox { position: absolute; top: 5px; left: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>智能雲端書庫</h2>
    <div style="margin-bottom: 20px;">
        <input type="file" id="fileInput" multiple onchange="handleFileSelect(this.files)">
        <button class="btn" onclick="toggleSelectionMode()" id="toggleBtn">選取刪除</button>
        <button class="btn btn-danger" onclick="deleteSelected()" id="deleteBtn" style="display:none;">執行刪除</button>
    </div>
    <div id="bookGrid"></div>
</div>

<script>
    let isSelectionMode = false;

    // 切換模式
    function toggleSelectionMode() {
        isSelectionMode = !isSelectionMode;
        document.getElementById('toggleBtn').innerText = isSelectionMode ? '取消' : '選取刪除';
        document.getElementById('deleteBtn').style.display = isSelectionMode ? 'inline-block' : 'none';
        renderGrid();
    }

    // 上傳檔案
    async function handleFileSelect(files) {
        const formData = new FormData();
        for (let f of files) formData.append('file', f);
        
        const res = await fetch('/upload', { method: 'POST', body: formData });
        if(res.ok) { alert("上傳成功"); location.reload(); }
        else { alert("上傳失敗，檢查網路"); }
    }

    // 刪除檔案
    async function deleteSelected() {
        const selected = Array.from(document.querySelectorAll('.book-checkbox:checked')).map(cb => cb.value);
        if(selected.length === 0) return alert("請選取");

        const res = await fetch('/books/delete', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ ids: selected })
        });
        
        if(res.ok) { alert("刪除成功"); location.reload(); }
        else { alert("刪除失敗"); }
    }

    function renderGrid() {
        const grid = document.getElementById('bookGrid');
        // 假設從 /books 獲取資料
        fetch('/books').then(r => r.json()).then(books => {
            grid.innerHTML = books.map(b => `
                <div class="book-card">
                    ${isSelectionMode ? `<input type="checkbox" class="book-checkbox" value="${b.id}">` : ''}
                    <div>${b.title}</div>
                </div>
            `).join('');
        });
    }
    
    renderGrid();
</script>
</body>
</html>
