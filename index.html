<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPUB 自動分類閱讀器</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="mb-4 text-center">📚 EPUB 自動分類閱讀器</h1>
        
        <!-- 上傳區 -->
        <div class="card p-4 mb-4 shadow-sm">
            <form id="uploadForm">
                <div class="mb-3">
                    <label class="form-label">請選擇 EPUB 檔案</label>
                    <input type="file" class="form-control" id="epubFile" accept=".epub" required>
                </div>
                <button type="submit" class="btn btn-primary w-100" id="uploadBtn">上傳並解析</button>
            </form>
            <div id="loading" class="text-center mt-3 d-none">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2">正在努力解析與分類書籍，請稍候...</p>
            </div>
        </div>

        <!-- 顯示區 -->
        <div id="resultArea" class="d-none">
            <div class="card p-4 shadow-sm">
                <h2 id="bookTitle" class="card-title"></h2>
                <div class="mb-3">
                    <span class="fs-5 badge bg-success" id="bookCategory"></span>
                </div>
                <hr>
                <!-- 標籤頁控制鈕 -->
                <ul class="nav nav-tabs" id="chapterTabs" role="tablist"></ul>
                <!-- 標籤頁內文 -->
                <div class="tab-content p-3 border border-top-0 bg-white" id="chapterTabContent" style="max-height: 600px; overflow-y: auto;"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('epubFile');
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            // 顯示載入動畫
            document.getElementById('loading').classList.remove('d-none');
            document.getElementById('uploadBtn').disabled = true;
            document.getElementById('resultArea').classList.add('d-none');

            try {
                const response = await fetch('/upload', { method: 'POST', body: formData });
                const data = await response.json();
                
                if (data.error) {
                    alert(data.error);
                    return;
                }

                // 渲染書籍資訊
                document.getElementById('bookTitle').innerText = data.title;
                document.getElementById('bookCategory').innerText = `系統自動分類：${data.category}`;

                const tabList = document.getElementById('chapterTabs');
                const tabContent = document.getElementById('chapterTabContent');
                tabList.innerHTML = '';
                tabContent.innerHTML = '';

                // 動態產生標籤頁
                data.chapters.forEach((ch, index) => {
                    const isActive = index === 0 ? 'active' : '';
                    const isSelected = index === 0 ? 'true' : 'false';
                    
                    tabList.innerHTML += `
                        <li class="nav-item" role="presentation">
                            <button class="nav-link ${isActive}" id="tab-${index}" data-bs-toggle="tab" data-bs-target="#content-${index}" type="button" role="tab" aria-selected="${isSelected}">${ch.title}</button>
                        </li>`;
                    
                    tabContent.innerHTML += `
                        <div class="tab-pane fade show ${isActive}" id="content-${index}" role="tabpanel">
                            <div style="white-space: pre-wrap; line-height: 1.8; font-size: 1.1rem; color: #333;">${ch.content}</div>
                        </div>`;
                });

                document.getElementById('resultArea').classList.remove('d-none');
            } catch (err) {
                alert('上傳失敗，請檢查伺服器連線');
            } finally {
                document.getElementById('loading').classList.add('d-none');
                document.getElementById('uploadBtn').disabled = false;
            }
        });
    </script>
</body>
</html>
